[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-insights"
version = "0.1.0"
description = "A local desktop dashboard and compact exporter for Codex session usage"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["tzdata>=2025.1", "tzlocal>=5", "watchdog>=6", "pywebview>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.16"]
mac-build = ["py2app>=0.28"]

[project.scripts]
codex-insights = "codex_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
